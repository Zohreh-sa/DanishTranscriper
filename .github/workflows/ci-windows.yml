name: Test and Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore DanishTranscriper.sln -r win-x64

      - name: Build
        run: dotnet build DanishTranscriper.sln -c Release --no-restore

      - name: Regression tests
        run: dotnet run --project DanishTranscriber.Tests/DanishTranscriber.Tests.csproj -c Release --no-build

      - name: Dependency vulnerability report
        run: dotnet list DanishTranscriper.sln package --vulnerable --include-transitive

      - name: Publish Windows x64
        run: dotnet publish DanishTranscriber/DanishTranscriber.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=false

      - name: Zip
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path DanishTranscriber/bin/Release/net9.0-windows/win-x64/publish/* -DestinationPath DanishTranscriber-Windows-x64.zip

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: DanishTranscriber-Windows-x64
          path: DanishTranscriber-Windows-x64.zip
          if-no-files-found: error
